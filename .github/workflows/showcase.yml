name: Showcase

# On a release tag, build & deploy the showcase against the PACKAGE JUST
# PUBLISHED TO npm (not the workspace source). This is a real release smoke
# test: it exercises the published artifact (exports map, shipped dist) the way
# an external consumer would, instead of rebuilding the lib from source.
#
# Ordering: release.yml publishes to npm off the same tag in parallel. This
# workflow polls npm until the version appears, then installs it.

on:
  push:
    tags:
      - 'v*.*.*'  # semantic-version tags only (vX.Y.Z) — deploys on release
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version to showcase (e.g. 0.0.1)'
        required: true

permissions:
  contents: write

jobs:
  deploy:
    name: Build & deploy showcase to GitHub Pages (released package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Resolve released version
        id: ver
        run: |
          v="${{ inputs.version }}"
          [ -n "$v" ] || v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Wait for the release to appear on npm
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          echo "Waiting for @hieupth/react-headless-ui@$VERSION on npm..."
          for i in $(seq 1 60); do
            if npm view "@hieupth/react-headless-ui@$VERSION" version >/dev/null 2>&1; then
              echo "Version $VERSION is available on npm."
              exit 0
            fi
            echo "  not yet ($i/60)..."
            sleep 10
          done
          echo "::error::Timed out waiting for @hieupth/react-headless-ui@$VERSION on npm." >&2
          exit 1

      - name: Point showcase at the released npm package
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Drop the lib from the pnpm workspace so the showcase resolves
          # @hieupth/react-headless-ui from npm instead of the local source
          # link, and set the showcase's dependency to the published version.
          cat > pnpm-workspace.yaml <<'YAML'
          packages:
            - 'examples'
          YAML
          tmp="$(mktemp)"
          jq --arg v "$VERSION" '.dependencies["@hieupth/react-headless-ui"] = $v' \
            examples/package.json > "$tmp" && mv "$tmp" examples/package.json
          echo "Showcase now depends on @hieupth/react-headless-ui@$VERSION (npm)."

      - name: Install deps (released package from npm)
        run: pnpm install --no-frozen-lockfile

      - name: Build showcase (static export)
        run: pnpm --filter showcase build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: examples/out
