# Release pipeline for @hieupth/react-headless-ui: stage → preview → gated publish.
#
# Flow (triggered by a vX.Y.Z tag push, or manually via workflow_dispatch):
#   1. stage   — install, test (full vitest suite), build, `npm pack` the
#                tarball, upload it as an artifact. The tarball is the exact
#                artifact a consumer would install.
#   2. preview — build the showcase against the packed TARBALL (not workspace
#                source, not npm) and deploy it to gh-pages for review.
#   3. publish — publish THE SAME validated tarball to npm. Gated behind the
#                `npm` environment: configure it in repo Settings →
#                Environments → npm with a required reviewer. The reviewer
#                checks the preview first; rejecting (or deleting the tag)
#                keeps the registry untouched.
#
# Setup (one-time):
#   - On npmjs.com, register a Trusted Publisher for @hieupth/react-headless-ui:
#     GitHub → owner `hieupth`, repo `react-headless-ui`, workflow `release.yml`,
#     environment `npm` (must match the publish job below). Publishing then uses
#     OIDC — no npm token secret needed.
#   - In repo Settings → Environments, create the `npm` environment with a
#     required reviewer (the approval gate before publish).

name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # semantic-version tags only (vX.Y.Z)
  workflow_dispatch:

# Cancel a superseded run when the same tag is re-pushed or force-pushed.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage:
    name: Build, test & pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build package (must emit .d.ts)
        run: pnpm build

      - name: Verify types shipped
        run: test -f packages/react-headless-ui/dist/index.d.ts

      - name: Pack tarball
        # `prepack` (package.json) stages README.md/LICENSE into the package
        # dir for the tarball.
        run: npm pack
        working-directory: packages/react-headless-ui

      - name: Upload tarball artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-tarball
          path: packages/react-headless-ui/*.tgz
          if-no-files-found: error

  preview:
    name: Showcase preview (from tarball)
    needs: stage
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to gh-pages
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download tarball artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball
          path: packages/react-headless-ui

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Point showcase at the packed tarball
        run: |
          # Drop the lib from the pnpm workspace so the showcase resolves
          # @hieupth/react-headless-ui from the tarball instead of the local
          # source link.
          cat > pnpm-workspace.yaml <<'YAML'
          packages:
            - 'examples'
          YAML
          VER="$(jq -r .version packages/react-headless-ui/package.json)"
          TARBALL="hieupth-react-headless-ui-$VER.tgz"
          test -f "packages/react-headless-ui/$TARBALL"
          tmp="$(mktemp)"
          jq --arg spec "file:../packages/react-headless-ui/$TARBALL" \
            '.dependencies["@hieupth/react-headless-ui"] = $spec' \
            examples/package.json > "$tmp" && mv "$tmp" examples/package.json
          echo "Showcase now depends on $TARBALL (pre-publish validation)."

      - name: Install deps (tarball)
        run: pnpm install --no-frozen-lockfile

      - name: Build showcase (static export)
        run: pnpm --filter showcase build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Deploy preview to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: examples/out

  publish:
    name: Publish to npm (approval required)
    needs: preview
    runs-on: ubuntu-latest
    environment: npm # protected: required reviewer gates the registry
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - name: Download tarball artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball

      - name: Setup Node
        # Node 24 (not .nvmrc): Trusted Publishing needs npm >= 11.5.1, and
        # Node 22 bundles npm 10.x.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish the validated tarball
        # Publish the exact tarball that the showcase preview was built
        # against — not a rebuild — so what was reviewed is what ships.
        # No NODE_AUTH_TOKEN: npm Trusted Publishing authenticates via the
        # job's OIDC identity (id-token: write + the registered publisher).
        run: npm publish ./hieupth-react-headless-ui-*.tgz --provenance --access public
